<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F8">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/anjian-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<title>案件详情 · 案卷</title>
<!-- 防闪烁：CSS 之前把皮肤铺好。9 页一字不差，逻辑与 js/skin.js 的 getSkin() 一致。
     旧键 anjian-theme(light|dark|auto) 就地迁移到 anjian-skin(pro|paper|jade|auto) 并删除；
     auto = 不设 data-skin（由 CSS @media prefers-color-scheme 回落 jade），契约见 css/style.css 层 B。 -->
<script>(function(){var D=document.documentElement,K='anjian-skin',O='anjian-theme',BG={pro:'#F6F7F8',paper:'#F4EFE3',jade:'#050D0A'},L={light:'pro',dark:'jade',auto:'auto'},s=null;try{s=localStorage.getItem(K);if(!s){var o=localStorage.getItem(O);if(o!==null){s=L[o]||'auto';localStorage.setItem(K,s);localStorage.removeItem(O);}}}catch(e){}if(s!=='pro'&&s!=='paper'&&s!=='jade'&&s!=='auto')s='auto';var r=s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'jade':'pro'):s;if(s==='auto')D.removeAttribute('data-skin');else D.setAttribute('data-skin',s);D.style.colorScheme=s==='auto'?'light dark':(r==='jade'?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',BG[r]);})();</script>
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/style.css?v=2.7.3-pr22">
</head>
<body>
<!-- 顶栏由 nav.js 挂载。 -->
<header class="context-header case-context-header">
  <div class="context-head-main">
    <div class="context-kicker">案件工作台</div>
    <h1 class="page-title" id="title">…</h1>
    <p class="page-sub" id="subtitle"></p>
  </div>
  <div class="case-context-tools">
    <div class="case-head-deadline" id="case-head-deadline" aria-live="polite"></div>
    <span id="case-status" class="pill"></span>
    <label class="context-status" data-case-write hidden>状态
      <select id="c-status" aria-label="案件状态">
        <option value="active">在办</option>
        <option value="shelved">搁置</option>
        <option value="closed">已结</option>
      </select>
    </label>
  </div>
  <nav class="section-nav" id="case-section-nav" aria-label="案件页分区">
    <a href="#case-overview" data-target="case-overview">概览</a>
    <a href="#case-actions" data-target="case-actions">期限与待办 <span class="section-badge" id="case-action-badge"></span></a>
    <a href="#case-money" data-target="case-money">资金 <span class="section-badge" id="case-money-badge"></span></a>
    <a href="#file-drop" data-target="file-drop">文件</a>
    <a href="#case-trace" data-target="case-trace">留痕</a>
    <a href="#case-changes" data-target="case-changes" data-case-audit hidden>变更</a>
    <a href="#case-archive" data-target="case-archive" hidden>归档</a>
  </nav>
</header>
<main class="page case-page">
  <p id="condition-warnings" class="pill warn" role="status" hidden></p>
  <div id="precondition-warning" class="precondition-warning" role="alert" hidden></div>
  <div id="precondition-hint" class="precondition-hint" role="status" hidden></div>
  <div class="case-layout" id="case-layout">

    <!-- ═══════ 案件进程：阶段步进 · 状态 · 案件信息 ═══════ -->
    <section class="panel case-side" id="case-overview" data-case-order="1">
      <div class="p-head">
        <h2 class="p-title">案件进程</h2>
        <span class="p-meta">九阶段纵览</span>
      </div>
      <div class="panel-body">
        <div id="stepper-box"></div>
        <details class="adder case-info-adjunct" data-case-write hidden>
          <summary>编辑案件信息</summary>
          <form id="edit-form">
            <div class="formgrid">
              <label class="f">案件名<input name="name" required placeholder="张三诉李四民间借贷纠纷"></label>
              <label class="f">案号<input name="case_no" placeholder="（2026）粤0105民初888号"></label>
              <label class="f">案由<input name="cause" placeholder="民间借贷纠纷"></label>
              <label class="f">法院 / 仲裁机构<input name="court" placeholder="深圳市南山区人民法院"></label>
              <label class="f">我方当事人<input name="client" placeholder="张三"></label>
              <label class="f">我方地位<input name="client_role" placeholder="原告 / 被告 / 申请人"></label>
              <label class="f">对方<input name="opponent" placeholder="李四"></label>
              <label class="f">收案日<input type="date" name="accepted_at"></label>
              <label class="f">诉讼时效起算日<input type="date" name="sol_starts_on"></label>
              <label class="f">案件类型<select name="case_type"><option>未分类</option><option>民事</option><option>刑事</option><option>行政</option><option>非诉</option><option>其他</option></select></label><label class="f">程序<select name="procedure"></select></label>
              <label class="f">阶段<select name="stage"></select></label>
              <label class="f" id="reconsideration-precondition-field" hidden>复议前置<select name="reconsideration_precondition"><option value="yes">是</option><option value="no">否</option><option value="unknown">未确定</option></select></label>
            </div>
            <div id="edit-criminal-fields"></div>
            <div class="formrow">
              <label class="f grow">备注<textarea name="note" rows="5"></textarea></label>
              <button class="btn primary" type="submit">保存</button>
            </div>
          </form>
        </details>
      </div>
      <div class="p-foot">
        <span id="c-stagedays"></span>
        <span class="tail" data-case-write hidden>点步进节点可切换阶段</span>
      </div>
    </section>

    <section class="panel case-main" id="case-elapsed" data-case-order="1" hidden>
      <div class="p-head"><h2 class="p-title">经过时间</h2><span class="p-meta">按事件计算的提醒</span></div>
      <div class="panel-body" id="elapsed-list"></div>
    </section>

    <!-- ═══════ 期限跑道（母题：今日 → 死线）═══════ -->
    <section class="panel case-main" id="case-actions" data-case-order="1">
      <div class="p-head">
        <h2 class="p-title">期限跑道</h2>
        <span class="p-meta" id="runway-meta"></span>
      </div>
      <div id="case-runway"></div>
      <div class="p-foot" id="runway-legend" hidden>
        <span class="lg lg-crit">逾期 / ≤3 日</span>
        <span class="lg lg-warn">4–7 日</span>
        <span class="lg lg-ok">8 日以上</span>
        <span class="tail">跑道：绿线为今日，圆点为死线</span>
      </div>
    </section>


    <!-- ═══════ 未结待办 ═══════ -->
    <section class="panel case-main" data-case-order="2">
      <div class="p-head">
        <h2 class="p-title">未结待办</h2>
        <div class="p-head-actions">
          <span class="p-meta"><span class="m" id="tasks-count"></span></span>
        </div>
      </div>
      <div id="open-tasks"></div>
    </section>

    <!-- ═══════ 录入（事件 · 死线 · 待办 · 日志）═══════ -->
    <section class="panel case-side aux-panel" id="case-inputs" data-case-order="3" aria-label="事实记录">
      <div class="p-head">
        <h2 class="p-title">事实记录</h2>
        <button type="button" class="btn small" id="fact-add" data-case-write hidden>添加事实</button>
      </div>
      <div id="fact-list" class="panel-body"></div>
    </section>

    <!-- ═══════ 联系人 ═══════ -->
    <section class="panel case-side" id="case-contacts" data-case-order="2" aria-label="联系人">
      <div class="factstrip factstrip--contacts" id="case-contacts-strip">
        <div class="factstrip-row">
          <span class="factstrip-label">当事人</span>
          <span class="factstrip-fact" id="contact-summary">委托人待补 · 对方待补 · 代理人待补</span>
          <button class="factstrip-edit" type="button" id="case-contacts-toggle" aria-expanded="false">展开</button>
        </div>
        <div class="factstrip-row case-participant-summary-row">
          <span class="factstrip-label">合作参与人</span>
          <span class="factstrip-fact" id="case-participant-summary">未登记</span>
        </div>
        <div class="factstrip-more" id="case-contacts-more" hidden>
          <div class="panel-body" id="case-participant-list"></div>
          <div id="contact-list"></div>
          <div class="panel-body">
        <details class="adder" data-case-write hidden>
          <summary>记联系人</summary>
          <form id="contact-form">
            <div class="formgrid">
              <label class="f">角色<select name="role">
                <option>当事人</option><option>对方当事人</option><option>承办法官</option>
                <option>法官助理</option><option>书记员</option><option>对方律师</option><option>合作律师</option><option>其他</option>
              </select></label>
              <label class="f">姓名<input name="name" required placeholder="张三"></label>
              <label class="f">电话<input name="phone" type="tel" placeholder="可空"></label>
              <label class="f">身份证号<input name="id_no" placeholder="法院人员留空"></label>
              <label class="f">单位 / 庭室<input name="org" placeholder="××法院××庭"></label>
              <label class="f">备注<input name="note" placeholder="送达地址 / 微信 / 分机…"></label>
            </div>
            <div class="formrow">
              <button class="btn primary" type="submit">记录</button>
            </div>
          </form>
        </details>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════ 律师费 ═══════ -->
    <section class="panel case-main" id="case-money" data-case-order="5">
      <div class="p-head">
        <h2 class="p-title">律师费</h2>
        <button type="button" class="btn small" id="fee-add" data-case-write hidden>记律师费</button>
      </div>
      <div class="panel-body" id="fee-viz"></div>
      <div id="fee-list"></div>
    </section>

    <section class="panel case-main" id="case-source-info" data-case-order="3" hidden>
      <details class="panel-body"><summary>案件备注与来源信息</summary><div id="case-source-text" style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1rem"></div></details>
    </section>
    <!-- ═══════ 案件文件（案件夹双向同步）═══════ -->
    <section class="panel case-main" id="file-drop" data-case-order="3">
      <div class="p-head">
        <h2 class="p-title">案件文件</h2>
        <span class="p-meta" id="file-crumbs"></span>
        <span class="p-meta file-status" id="file-status" aria-live="polite"></span>
        <button class="btn small ghost" id="file-refresh" type="button" title="重新读取案件夹">刷新</button>
      </div>
      <div id="file-list"></div>
      <details class="panel-body"><summary>附件引用</summary><div id="attachment-list"></div></details>
      <div class="p-foot file-upload-zone" data-case-write hidden>
        <div class="file-drop-copy" id="file-drop-copy">
          <b>拖文件到这里</b>
          <span>或选择文件上传</span>
        </div>
        <div class="file-upload-controls">
          <select id="up-dir" aria-label="上传目录"></select>
          <input type="file" id="up-files" multiple aria-label="选择上传文件">
          <button class="btn small" id="up-btn" type="button">上传</button>
        </div>
      </div>
    </section>

    <!-- ═══════ 时间线 ═══════ -->
    <section class="panel case-main" id="case-trace" data-case-order="4">
      <div class="p-head">
        <h2 class="p-title">时间线</h2>
        <div class="p-head-actions">
          <span class="p-meta" id="timeline-meta">事件 · 期限 · 日志</span>
        </div>
      </div>
      <div class="timeline-filters" role="group" aria-label="筛选时间线">
        <button class="is-active" type="button" data-timeline-filter="all">全部</button>
        <button type="button" data-timeline-filter="event">事件</button>
        <button type="button" data-timeline-filter="deadline">期限</button>
        <button type="button" data-timeline-filter="log">日志</button>
      </div>
      <div class="panel-body">
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="p-foot" id="timeline-controls" hidden>
        <button class="btn small" id="timeline-toggle" type="button" aria-controls="timeline" aria-expanded="false">展开全部</button>
        <span class="tail" id="timeline-visible-meta" role="status" aria-live="polite"></span>
      </div>
    </section>

    <!-- ═══════ 本案操作审计 ═══════ -->
    <section class="panel case-main case-changes-section" id="case-changes" data-case-order="5" data-case-audit hidden>
      <details class="fold case-changes-fold" id="case-changes-fold" data-fold-id="case-changes">
        <summary>
          <span class="fold-title">变更记录</span>
          <span class="fold-summary" id="case-changes-meta">管理员可读</span>
        </summary>
        <div class="fold-body case-changes-body" id="case-changes-body"></div>
      </details>
    </section>

    <!-- ═══════ 历史律师费（本页唯一归档门）═══════ -->
    <section class="panel case-main case-archive-section" id="case-archive" data-case-order="6" hidden>
      <details class="archive-door case-archive-door" id="case-archive-door" data-fold-id="case-archive">
        <summary class="archive-door-summary">
          <span class="archive-door-caret">▸</span>
          <span class="archive-door-text">历史律师费</span>
          <span class="archive-door-count" id="case-archive-count"></span>
        </summary>
        <div class="archive-door-body" id="case-archive-body"></div>
      </details>
    </section>

  </div>
</main>
<script type="module" src="/js/case.js?v=2.7.3-pr22"></script>
</body>
</html>
