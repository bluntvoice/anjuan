<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>案件管理 · 案卷</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/phase2.css">
</head>
<body class="case-workspace">
  <header class="workspace-header">
    <div><a class="workspace-brand" href="/phase2.html">案卷</a><span>案件管理</span></div>
    <nav aria-label="账号"><span id="identity"></span><a href="/users.html">账号设置</a><button type="button" id="logout" class="btn">退出登录</button></nav>
  </header>
  <main class="workspace-main">
    <section class="workspace-index" aria-labelledby="case-list-title">
      <div class="workspace-heading"><h1 id="case-list-title">案件</h1><button id="new-case" class="btn" type="button" hidden>新建案件</button></div>
      <form id="search" class="workspace-search">
        <label for="case-query" class="workspace-sr-only">搜索案件</label>
        <input id="case-query" name="q" type="search" placeholder="案名、案号、当事人">
        <button class="btn" type="submit">搜索</button>
      </form>
      <nav id="case-list" aria-label="案件列表"></nav>
    </section>
    <section class="workspace-detail" aria-label="案件详情">
      <p id="message" class="workspace-message" role="status"></p>
      <article id="case-detail"><p>选择一个案件查看详情。</p></article>
    </section>
  </main>
  <dialog id="record-dialog" aria-labelledby="dialog-title"></dialog>
  <script type="module" src="/js/phase2.js"></script>
</body>
</html>
